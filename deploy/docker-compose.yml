# Despliegue on-prem del pivote InfoObras: backend (FastAPI) + panel (Next.js).
# Asume que los repos Pivote y Panel-InfoObras están como hermanos:
#   .../InfoObras/Pivote            (este repo; el compose vive en deploy/)
#   .../InfoObras/Panel-InfoObras   (el panel)
#
# Uso — UN comando desde la raíz (D:\proyectos\InfoObras):
#   docker compose -f .\Pivote\deploy\docker-compose.yml up -d --build
# (el .env se lee solo desde Pivote\deploy\.env, junto a este archivo)
# El skill y el MCP NO van aquí: corren en la máquina del ingeniero (ver docs).

name: infoobras-pivote

services:
  backend:
    build:
      context: ..                    # raíz del repo Pivote
      dockerfile: backend/Dockerfile
    image: infoobras-backend
    environment:
      PIVOTE_ETAPAS: ${PIVOTE_ETAPAS:-real}        # real = cruces SUNAT/InfoObras
      PIVOTE_MAX_DESCARGAS: ${PIVOTE_MAX_DESCARGAS:-}  # vacío = baja TODO; N = tope solo en pruebas
      PIVOTE_DATA_DIR: /datos
      INFOOBRAS_DOWNLOAD_RETRIES: ${INFOOBRAS_DOWNLOAD_RETRIES:-5}  # portal intermitente → 5 reintentos
      SUNAT_MAX_RETRIES: ${SUNAT_MAX_RETRIES:-5}
      TZ: America/Lima
    volumes:
      - datos_pivote:/datos          # jobs/espejos/entregables (datos del cliente)
    ports:
      - "${BACKEND_PORT:-8001}:8001" # REQUERIDO en LAN: el browser baja el ZIP directo + el MCP de Manuel
    healthcheck:                     # smoke test integrado: docker compose ps → "healthy"
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/pivote/salud', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  panel:
    build:
      context: ../../Panel-InfoObras/frontend
      dockerfile: Dockerfile
      args:
        # URL del backend para el BROWSER (LAN), horneada en build-time → el panel
        # baja el ZIP DIRECTO del backend (el proxy no streamea GBs). IP LAN, no localhost.
        # `:?` = compose ABORTA si falta en deploy/.env (el error nº1 del despliegue).
        NEXT_PUBLIC_PIVOTE_API: ${NEXT_PUBLIC_PIVOTE_API:?define NEXT_PUBLIC_PIVOTE_API en deploy/.env con la IP LAN del server (NO localhost)}
    image: infoobras-panel
    environment:
      # El panel proxyea /api/pivote/* a este servicio (red interna de compose).
      PIVOTE_API: http://backend:8001
    ports:
      - "${PANEL_PORT:-3002}:3002"   # la URL que abre el ingeniero
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy   # el panel arranca cuando el backend ya responde
    restart: unless-stopped

  # --- Persistencia PostgreSQL — PENDIENTE de cablear en el backend ------------
  # Hoy el backend persiste en ARCHIVOS (volumen datos_pivote). Cuando se cablee
  # un RepositorioPostgres (+ el caché SUNAT de sunat_cache.py), descomentar este
  # servicio y apuntar el backend con DATABASE_URL=postgres://infoobras:...@db/infoobras
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: infoobras
  #     POSTGRES_USER: infoobras
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en deploy/.env}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  datos_pivote:
  # pgdata:
