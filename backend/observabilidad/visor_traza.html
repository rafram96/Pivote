<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de Trazas · JSONL</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --panel2:#f1f3f7; --ink:#1b2433; --muted:#66707f;
    --line:#dde2e9; --acc:#3b6fd4; --ok:#2f9e63; --err:#cf5a5a; --warn:#d99a2b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12151b; --panel:#1a1f28; --panel2:#151a22; --ink:#e8ebf1; --muted:#96a0b0;
           --line:#2e3542; --acc:#7aa0ee; --ok:#5ec78f; --err:#ef8d8d; --warn:#eec06a; }
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI",system-ui,sans-serif;
       padding:22px; max-width:1240px; margin:0 auto}
  h1{font-size:1.2rem} .sub{color:var(--muted); font-size:.85rem; margin:2px 0 14px}
  code{background:var(--line); border-radius:4px; padding:0 5px; font-size:.85em}

  #drop{border:2px dashed var(--line); border-radius:12px; padding:34px; text-align:center;
        color:var(--muted); background:var(--panel); cursor:pointer; display:block; transition:.15s}
  #drop.over{border-color:var(--acc); color:var(--acc)}
  #drop input{display:none}

  .barra{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0}
  .barra input[type=text]{flex:1; min-width:200px; padding:6px 10px; border:1px solid var(--line);
        border-radius:8px; background:var(--panel); color:var(--ink)}
  .chip{border:1.5px solid var(--line); border-radius:99px; padding:3px 11px; font-size:.8rem;
        cursor:pointer; user-select:none; background:var(--panel); color:var(--muted)}
  .chip.on{border-color:var(--acc); color:var(--acc); font-weight:600}
  .stats{color:var(--muted); font-size:.8rem; margin-left:auto}

  /* cabecera de trace */
  .trace{margin-bottom:26px}
  .trace-head{display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; padding:4px 2px 10px}
  .trace-head b{font-size:1.02rem}
  .mini{color:var(--muted); font-size:.78rem}
  .pill{font-size:.72rem; font-weight:700; border-radius:99px; padding:2px 10px}
  .pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok)}
  .pill.err{background:color-mix(in srgb,var(--err) 16%,transparent); color:var(--err)}
  .pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn)}
  .pill.acc{background:color-mix(in srgb,var(--acc) 16%,transparent); color:var(--acc)}

  /* tarjeta por operación (span de primer nivel) */
  .op{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden}
  .op > summary{list-style:none; cursor:pointer; padding:10px 14px; display:grid;
       grid-template-columns:26px 1fr auto auto; gap:6px 12px; align-items:center}
  .op > summary::-webkit-details-marker{display:none}
  .op-num{width:24px; height:24px; border-radius:50%; background:var(--panel2); border:1px solid var(--line);
       color:var(--muted); font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center}
  .op-titulo{min-width:0}
  .op-titulo .nombre{font-weight:600; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .op-titulo .veredicto{font-size:.8rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .op-dur{text-align:right; white-space:nowrap}
  .op-dur .n{font-variant-numeric:tabular-nums; font-size:.82rem}
  .op-dur .b{height:6px; border-radius:3px; background:var(--acc); opacity:.7; margin-top:3px; margin-left:auto}

  .op-cuerpo{border-top:1px solid var(--line); background:var(--panel2); padding:6px 0}
  .fila{display:grid; grid-template-columns:86px 200px 120px 1fr; gap:0 14px;
        padding:5px 14px; align-items:baseline}
  .fila + .fila{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .fila .t{color:var(--muted); font-size:.76rem; font-variant-numeric:tabular-nums; text-align:right}
  .fila .e{font-size:.82rem; font-weight:600; white-space:nowrap}
  .fila .e .sang{color:var(--muted); font-weight:400}
  .fila.err .e{color:var(--err)}
  .fila.dec .e{color:var(--ok)}
  .fila.veto .e{color:var(--warn)}
  .fila .d{white-space:nowrap}
  .fila .d .b{display:inline-block; height:7px; border-radius:3px; background:var(--acc); opacity:.7; vertical-align:middle; min-width:2px}
  .fila .d .n{color:var(--muted); font-size:.74rem; margin-left:6px; font-variant-numeric:tabular-nums}
  .kv{display:flex; flex-wrap:wrap; gap:3px 10px; min-width:0}
  .kv span{font-size:.79rem; color:var(--ink); max-width:100%; overflow-wrap:anywhere}
  .kv b{color:var(--muted); font-weight:600; font-size:.74rem; margin-right:3px}
  .kv .destacado{background:color-mix(in srgb,var(--acc) 12%,transparent); border-radius:5px; padding:0 6px}

  .sueltos{margin-top:4px}
  @media (max-width:820px){ .fila{grid-template-columns:70px 1fr; } .fila .d,.fila .t{display:none} }
</style>
</head>
<body>

<h1>Visor de Trazas</h1>
<p class="sub">Arrastra un <code>traza.jsonl</code> (o varios). Cada <b>operación</b> (span de primer nivel)
es una tarjeta con su veredicto; dentro, sus eventos con tiempo relativo al inicio de la operación.
Autocontenido y genérico — reutilizable en cualquier proyecto.</p>

<label id="drop">Suelta aquí el archivo de traza · o haz clic para elegir
  <input type="file" multiple accept=".jsonl,.json,.log,.txt">
</label>

<div class="barra" id="controles" style="display:none">
  <input type="text" id="filtro" placeholder="filtrar por texto (evento, atributo, valor)…">
  <span id="chips"></span>
  <span class="stats" id="stats"></span>
</div>
<div id="salida"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const drop = $('#drop'), inp = drop.querySelector('input');
  let eventos = [];
  let tiposOff = new Set();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ATRIBUTOS_TITULO = ['proyecto','clave','nombre','titulo','id','obra'];
  const RESERVADOS = ['ts','ev','ms','trace','en','span','_archivo'];

  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); cargar(e.dataTransfer.files); });
  inp.addEventListener('change', () => cargar(inp.files));
  $('#filtro').addEventListener('input', render);

  async function cargar(files){
    eventos = [];
    for (const f of files){
      const txt = await f.text();
      for (const linea of txt.split(/\r?\n/)){
        if (!linea.trim()) continue;
        try { const o = JSON.parse(linea); o._archivo = f.name; eventos.push(o); } catch {}
      }
    }
    eventos.sort((a,b) => String(a.ts||'').localeCompare(String(b.ts||'')));
    $('#controles').style.display = 'flex';
    armarChips(); render();
  }

  function armarChips(){
    const tipos = [...new Set(eventos.map(e => e.ev || '?'))].sort();
    $('#chips').innerHTML = tipos.map(t =>
      `<span class="chip on" data-t="${esc(t)}">${esc(t)}</span>`).join(' ');
    $('#chips').querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
      const t = ch.dataset.t;
      tiposOff.has(t) ? (tiposOff.delete(t), ch.classList.add('on'))
                      : (tiposOff.add(t), ch.classList.remove('on'));
      render();
    });
  }

  // ── agrupar en OPERACIONES: los eventos entre el inicio y el cierre de un
  //    span de primer nivel forman una tarjeta; el evento "span" les da nombre
  //    y duración. Eventos fuera de todo span → "eventos sueltos".
  function agrupar(evs){
    const ops = [], sueltos = [];
    let abierta = null;   // {eventos:[], cierre:null}
    for (const e of evs){
      const raiz = (e.span || e.en || '').split('/')[0];
      const esCierreTop = (e.ev === 'span' || e.ev === 'error') && e.span && !e.span.includes('/');
      if (esCierreTop){
        (abierta ??= {eventos: []}).cierre = e;
        ops.push(abierta); abierta = null;
      } else if (raiz){
        (abierta ??= {eventos: []}).eventos.push(e);
      } else {
        sueltos.push(e);
      }
    }
    if (abierta) ops.push(abierta);            // span sin cierre (proceso cortado)
    return {ops, sueltos};
  }

  function tsMs(ts){ const d = new Date(ts); return isNaN(d) ? 0 : d.getTime(); }

  function kvHtml(e, destacar = []){
    return Object.entries(e)
      .filter(([k]) => !RESERVADOS.includes(k))
      .map(([k,v]) => {
        const val = typeof v === 'object' ? JSON.stringify(v) : String(v);
        const d = destacar.includes(k) ? ' class="destacado"' : '';
        return `<span${d}><b>${esc(k)}:</b> ${esc(val)}</span>`;
      }).join('');
  }

  function veredictoDe(op){
    const dec = op.eventos.filter(e => e.ev === 'decision').at(-1);
    if (!dec) return {txt: '', pill: ''};
    const estado = dec.estado || '';
    const clase = estado === 'resuelto' ? 'ok' : estado === 'revision' ? 'warn' : 'acc';
    const extra = [dec.via, dec.cui].filter(Boolean).join(' · ');
    return {txt: `${dec.motivo || ''}`,
            pill: `<span class="pill ${clase}">${esc(estado)}${extra ? ' · ' + esc(extra) : ''}</span>`};
  }

  function render(){
    const q = ($('#filtro').value || '').toLowerCase();
    const vis = eventos.filter(e => !tiposOff.has(e.ev || '?'))
      .filter(e => !q || JSON.stringify(e).toLowerCase().includes(q));

    const porTrace = new Map();
    for (const e of vis){
      const k = e.trace || e._archivo || '(sin trace)';
      if (!porTrace.has(k)) porTrace.set(k, []);
      porTrace.get(k).push(e);
    }

    let html = '';
    for (const [trace, evs] of porTrace){
      const {ops, sueltos} = agrupar(evs);
      const errores = evs.filter(e => e.ev === 'error').length;
      const totalMs = ops.reduce((s,o) => s + (+(o.cierre?.ms) || 0), 0);
      const maxOp = Math.max(1, ...ops.map(o => +(o.cierre?.ms) || 0));

      html += `<div class="trace"><div class="trace-head">
        <b>${esc(trace)}</b>
        <span class="mini">${ops.length} operaciones · ${evs.length} eventos · ${totalMs.toFixed(0)} ms</span>
        <span class="pill ${errores ? 'err' : 'ok'}">${errores ? errores + ' error(es)' : 'sin errores'}</span>
      </div>`;

      ops.forEach((op, i) => {
        const c = op.cierre || {};
        const nombreOp = c.span || (op.eventos[0]?.en || '?').split('/')[0];
        const attrTitulo = ATRIBUTOS_TITULO.map(k => c[k]).find(v => v) || '';
        const {txt, pill} = veredictoDe(op);
        const ms = +c.ms || 0;
        const w = ms ? Math.max(3, 140 * ms / maxOp) : 0;
        const t0 = op.eventos.length ? tsMs(op.eventos[0].ts) : tsMs(c.ts);
        const maxEv = Math.max(1, ...op.eventos.map(e => +e.ms || 0));

        let filas = '';
        for (const e of op.eventos){
          const rel = tsMs(e.ts) - t0;
          const prof = ((e.en || '').match(/\//g) || []).length;
          const clase = e.ev === 'error' ? 'err' : e.ev === 'decision' ? 'dec'
                      : (e.ev || '').startsWith('veto') ? 'veto' : '';
          const ems = +e.ms || 0;
          const wev = ems ? Math.max(2, 90 * ems / maxEv) : 0;
          filas += `<div class="fila ${clase}">
            <span class="t">+${(rel/1000).toFixed(2)}s</span>
            <span class="e"><span class="sang">${'│ '.repeat(prof)}</span>${esc(e.ev)}</span>
            <span class="d">${ems ? `<span class="b" style="width:${wev}px"></span><span class="n">${ems} ms</span>` : ''}</span>
            <span class="kv">${kvHtml(e, e.ev === 'decision' ? ['estado','via','cui'] : [])}</span>
          </div>`;
        }
        html += `<details class="op"><summary>
          <span class="op-num">${i + 1}</span>
          <span class="op-titulo">
            <div class="nombre">${esc(nombreOp)}${attrTitulo ? ' — ' + esc(attrTitulo) : ''}</div>
            ${txt ? `<div class="veredicto">${esc(txt)}</div>` : ''}
          </span>
          ${pill || '<span></span>'}
          <span class="op-dur"><span class="n">${ms ? ms.toFixed(0) + ' ms' : ''}</span>
            ${ms ? `<div class="b" style="width:${w}px"></div>` : ''}</span>
        </summary><div class="op-cuerpo">${filas ||
          '<div class="fila"><span class="t"></span><span class="e mini">sin eventos internos</span></div>'}</div></details>`;
      });

      if (sueltos.length){
        html += `<details class="op sueltos"><summary>
          <span class="op-num">·</span>
          <span class="op-titulo"><div class="nombre">eventos sueltos (fuera de toda operación)</div></span>
          <span></span><span class="op-dur"><span class="n">${sueltos.length}</span></span>
        </summary><div class="op-cuerpo">${sueltos.map(e => `
          <div class="fila"><span class="t">${esc((e.ts||'').slice(11,23))}</span>
          <span class="e">${esc(e.ev)}</span><span class="d"></span>
          <span class="kv">${kvHtml(e)}</span></div>`).join('')}</div></details>`;
      }
      html += '</div>';
    }
    $('#stats').textContent = `${vis.length}/${eventos.length} eventos`;
    $('#salida').innerHTML = html || '<p class="sub">Sin eventos que coincidan con el filtro.</p>';
  }
})();
</script>
</body>
</html>
